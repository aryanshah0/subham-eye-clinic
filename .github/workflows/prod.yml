# Push or merge to `main` → the clinic's website on Cloudflare Pages.
# https://subhameyeclinic.pages.dev/
# Needs the repository secret CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit) and the variable CLOUDFLARE_ACCOUNT_ID.
name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://subhameyeclinic.pages.dev/
    env:
      PRIVATE_NUMBERS: ${{ secrets.PRIVATE_NUMBERS }}
      # Search Console ownership tag for https://subhameyeclinic.pages.dev/ (property in the clinic's Google account). Public by design.
      GSC_VERIFY: hHqsPFy3_C4d32inyuePy1419sXh2hgpdI6Hb3P8cOk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable (see README)."; exit 1
          fi
          npx wrangler pages deploy dist --project-name subhameyeclinic --branch main \
            --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s)"
      - name: Check the live site
        run: |
          sleep 20
          for p in / /gu/ /cataract-surgery/ /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://subhameyeclinic.pages.dev$p"); echo "$p $code"; [ "$code" = 200 ]
          done
          js=$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          curl -s https://subhameyeclinic.pages.dev/ | grep -q "$js" && echo "live serves this build ($js)"
