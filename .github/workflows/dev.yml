# Push or merge to `develop` → development copy on GitHub Pages (noindex, with a "development copy" strip).
# https://aryanshah0.github.io/subham-eye-clinic/
name: Deploy dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PRIVATE_NUMBERS: ${{ secrets.PRIVATE_NUMBERS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /subham-eye-clinic/
          DEV: "1"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
